server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: taskpilot-scheduler
  rabbitmq:
    # 第 4 周起：执行结果异步上报（执行器 -> 调度中心）。
    host: ${TASKPILOT_RABBITMQ_HOST:127.0.0.1}
    port: ${TASKPILOT_RABBITMQ_PORT:5672}
    username: ${TASKPILOT_RABBITMQ_USERNAME:taskpilot}
    password: ${TASKPILOT_RABBITMQ_PASSWORD:taskpilot}
    virtual-host: ${TASKPILOT_RABBITMQ_VHOST:/}
    # 发布确认：结果消息必须确认落到 broker，否则调度中心收不到结果。
    publisher-confirm-type: correlated
    listener:
      simple:
        # broker 不可达 / 队列还不存在时不能把应用启动卡死：
        # 监听容器会自己重试，连接失败只打日志（和 Redisson 一样是懒连接）。
        missing-queues-fatal: false
        default-requeue-rejected: false
        prefetch: 10
  task:
    scheduling:
      # @Scheduled 默认只有 1 个线程：执行器健康检查、僵尸记录回收、退避重试扫描
      # 会互相阻塞。退避重试的真正执行已经放到分片线程池，这里仍留出余量。
      pool:
        size: 4
      thread-name-prefix: taskpilot-sched-
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS
  datasource:
    url: ${TASKPILOT_MYSQL_URL:jdbc:mysql://localhost:3306/taskpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${TASKPILOT_MYSQL_USERNAME:taskpilot}
    password: ${TASKPILOT_MYSQL_PASSWORD:taskpilot}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 3000
  lifecycle:
    timeout-per-shutdown-phase: 20s

# Nacos 配置中心在后续接入：以 optional: 方式导入，本地无 Nacos 也能启动。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 公共标签：多应用指标汇到同一个 Prometheus 时靠它区分来源
      application: taskpilot-scheduler
    distribution:
      percentiles-histogram:
        # 触发接口快回，压测拐点要靠这条的 P95/P99 观测（与压测报告口径对齐）
        http.server.requests: true

taskpilot:
  auth:
    # 双向共享静态 token：调度中心 -> 执行器（/api/v1/executor/**）、
    # 执行器 -> 调度中心（POST /api/v1/executors/register 与 /heartbeat）都要带
    # X-TaskPilot-Token 头。管理 API（任务 CRUD / 执行记录 / 仪表盘）保持开放。
    # 这里的默认值只用于本机开发，生产环境必须用 TASKPILOT_AUTH_TOKEN 覆盖！
    token: ${TASKPILOT_AUTH_TOKEN:taskpilot-dev-token}
  execution:
    # 僵尸 RUNNING 记录回收：任务超时时间 + 宽限 秒
    stale-grace-seconds: 60
    recovery-interval-seconds: 60
    # 退避重试的兜底扫描间隔（内存延迟队列丢失后靠它捞回来）
    retry-scan-interval-seconds: 10
  alert:
    # 告警 webhook（可选）：不配就只把告警记在日志里，不做外发。
    webhook-url: ${TASKPILOT_ALERT_WEBHOOK_URL:}
  metrics:
    # 队列深度 gauge 走 RabbitMQ management API 轮询（ADR-022）。
    # 凭据复用 spring.rabbitmq.username/password，不单独配。
    rabbit-management:
      url: ${TASKPILOT_RABBITMQ_MANAGEMENT_URL:http://127.0.0.1:15672}
  scheduler:
    # 时间轮：槽位数按秒对齐，一个槽位代表一轮里的同一秒。
    wheel-size: 60
    tick-millis: 1000
    # 进程长时间挂起后最多回补多少秒；落后太多直接跳到当前秒。
    max-catch-up-seconds: 300
    # 进程停机期间错过触发的补偿策略：SKIP 跳过 / FIRE_ONCE 补跑一次。
    misfire-policy: SKIP
    misfire-threshold-seconds: 300
    # 分片分配策略：平均 / 哈希 / 广播。
    shard-allocation: AVERAGE
    trigger-pool:
      core-size: 4
      max-size: 16
      queue-capacity: 512
    # 领导选举：集群里只让 leader 推时间轮。
    election:
      enabled: true
      redis-address: redis://127.0.0.1:6379
      lock-key: taskpilot:scheduler:leader
      token-key: taskpilot:scheduler:fence:token
      retry-interval-ms: 2000
      # 不配固定租约：tryLock() 走 Redisson watchdog 自动续期。
      # 传 leaseTime 会关掉续期，活着的 leader 也会在租约到期后丢锁。
  executor:
    heartbeat-timeout-seconds: 30
    health-check-interval-seconds: 10
    dispatch:
      connect-timeout-ms: 3000
      read-timeout-ms: 65000

logging:
  level:
    com.taskpilot: INFO