services:
  mysql:
    image: mysql:8.0
    container_name: taskpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskpilot
      MYSQL_USER: taskpilot
      MYSQL_PASSWORD: taskpilot
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - taskpilot-mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: taskpilot-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - taskpilot-redis:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: taskpilot-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - taskpilot-nacos:/home/nacos/data

  # 第 4 周起需要：执行结果异步上报 + 死信告警走 RabbitMQ。
  # 5672 是 AMQP 端口，15672 是管理界面（http://127.0.0.1:15672，taskpilot/taskpilot）。
  rabbitmq:
    image: rabbitmq:3-management
    container_name: taskpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: taskpilot
      RABBITMQ_DEFAULT_PASS: taskpilot
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - taskpilot-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 第 4 周收尾③：可观测性栈（ADR-022）。应用跑在宿主机（java -jar），
  # Prometheus 经 host.docker.internal 抓 8080/8081 的 /actuator/prometheus。
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: taskpilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Docker Desktop 自带 host.docker.internal；Linux 靠 host-gateway 等价解析。
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana 自动 provisioning 数据源与 TaskPilot dashboard；
  # admin/admin 是演示口令（README 已注明），别带进生产。
  grafana:
    image: grafana/grafana:10.4.5
    container_name: taskpilot-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - taskpilot-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  taskpilot-mysql:
  taskpilot-redis:
  taskpilot-nacos:
  taskpilot-rabbitmq:
  taskpilot-grafana: