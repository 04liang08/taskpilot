server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: taskpilot-executor
  rabbitmq:
    # 第 4 周起：执行结果异步上报（执行器 -> 调度中心）。
    host: ${TASKPILOT_RABBITMQ_HOST:127.0.0.1}
    port: ${TASKPILOT_RABBITMQ_PORT:5672}
    username: ${TASKPILOT_RABBITMQ_USERNAME:taskpilot}
    password: ${TASKPILOT_RABBITMQ_PASSWORD:taskpilot}
    virtual-host: ${TASKPILOT_RABBITMQ_VHOST:/}
    # 发布确认：结果消息必须确认落到 broker，否则调度中心收不到结果。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # broker 不可达 / 队列还不存在时不能把应用启动卡死。
        missing-queues-fatal: false
        default-requeue-rejected: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS
  lifecycle:
    timeout-per-shutdown-phase: 20s

# Nacos 配置中心在后续接入：以 optional: 方式导入，本地无 Nacos 也能启动。
taskpilot:
  executor:
    app-name: taskpilot-executor
    group: DEFAULT
    address: ${TASKPILOT_EXECUTOR_ADDRESS:127.0.0.1:8081}
    # 调度中心地址，支持逗号分隔多个（冗余保护：一个挂掉还能通过另一个心跳）
    scheduler-base-url: ${TASKPILOT_SCHEDULER_URL:http://127.0.0.1:8080}
    heartbeat-interval-seconds: 10
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    thread-pool:
      core-size: 8
      max-size: 32
      queue-capacity: 256
    # 调度线程池：执行接口只回 ACK，处理器在这里跑完并把结果发回调度中心。
    # 线程数 = 同时能跑的分片数；队列满时直接拒绝，调度中心会标失败并重试。
    dispatch-pool:
      core-size: 16
      max-size: 32
      queue-capacity: 64

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.taskpilot: INFO