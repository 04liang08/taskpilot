name: CI

# push 到 main / feat/** 或对 main 提 PR 时触发。
# main 不设分支限制的通配之外还要保留 feat/**：本项目的开发都在特性分支上做。
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  # job 1：纯单元测试，不需要任何外部服务。
  build-and-test:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn clean verify
        run: mvn -B clean verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # job 2：端到端冒烟（双组件 + 三个中间件）。
  # 只跑 scripts/e2e-smoke.sh 的子集：完整验收（scripts/verify-week3.ps1 / verify-week4.ps1）
  # 是 Windows 脚本，按端口定位进程，跑在 CI 里不合适，也不该拖慢每次提交。
  e2e-smoke:
    name: 端到端冒烟
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: taskpilot
          MYSQL_USER: taskpilot
          MYSQL_PASSWORD: taskpilot
          MYSQL_ROOT_PASSWORD: root
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: taskpilot
          RABBITMQ_DEFAULT_PASS: taskpilot
        ports:
          - '5672:5672'
          - '15672:15672'
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包
        # 用 clean 保证 jar 是最新的：README 5.2 提醒过"测试编译失败会导致 jar 不更新"。
        run: mvn -B clean package -DskipTests

      - name: 安装 mysql 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-mysql-client

      - name: 建表
        # GitHub Actions 的 service container 不会像 docker compose 那样自动执行
        # /docker-entrypoint-initdb.d 下的脚本，建表必须手动做。
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e \
            "GRANT ALL PRIVILEGES ON taskpilot.* TO 'taskpilot'@'%'; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -P 3306 -u taskpilot -ptaskpilot taskpilot < deploy/sql/01-init.sql

      - name: 端到端冒烟
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: taskpilot
          MYSQL_PASSWORD: taskpilot
          MYSQL_DATABASE: taskpilot
          REDIS_HOST: 127.0.0.1
          RABBIT_HOST: 127.0.0.1
          SCHEDULER_PORT: '8080'
          EXECUTOR_PORT: '8081'
          AUTH_TOKEN: taskpilot-ci-token
        run: bash scripts/e2e-smoke.sh

      - name: 上传冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-logs
          path: .tmp/e2e-smoke/
          retention-days: 7
